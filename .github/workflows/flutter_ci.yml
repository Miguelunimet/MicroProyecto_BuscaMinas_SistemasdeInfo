name: Flutter CI

# Se ejecuta cada vez que haces push o pull request en CUALQUIER rama
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Descarga tu código en el servidor de GitHub
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Configura Java, necesario para las herramientas de Flutter
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # 3. Descarga e instala Flutter automáticamente en el servidor
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    # 4. Descarga las librerías del proyecto
    - name: Install dependencies
      run: flutter pub get

    # 5. Analiza el código para buscar errores
    - name: Analyze project source
      run: flutter analyze

    # 6. Compila para Web para verificar que todo corra perfecto
    - name: Build Web
      run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

    # 7. Sube el juego compilado a GitHub Pages automáticamente
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: build/web